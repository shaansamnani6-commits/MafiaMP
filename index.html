<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Is The Imposter? - Beta Squad Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS for P2P Networking -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0d1124;
      background: radial-gradient(circle at top, #1a2246 0%, #0d1124 100%);
      color: #ffffff;
      user-select: none;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .card-glass {
      background: rgba(22, 30, 60, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .card-interactive {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-interactive:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }

    .glow-blue {
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.35);
    }
    .glow-indigo {
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>

  <!-- Main Container -->
  <div id="app" class="w-full max-w-xl card-glass rounded-[32px] p-6 sm:p-8 relative z-10 my-auto">
    <!-- Header -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-950/70 border border-indigo-500/30 rounded-full text-indigo-300 text-xs font-bold tracking-widest uppercase mb-3 shadow-inner">
        <span id="gameModeBadge">BETA SQUAD STYLE EDITION</span>
      </div>
      <h1 id="headerTitle" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
        Who Is The Imposter?
      </h1>
      <p id="headerSubtitle" class="text-xs sm:text-sm text-slate-400 mt-2 font-medium max-w-md mx-auto">
        Multi-round deductions, dramatic eliminations, and game forfeits!
      </p>
    </header>

    <!-- Screen Container -->
    <main id="screenContainer" class="flex flex-col items-center w-full justify-center">
      <!-- Dynamically Rendered -->
    </main>
  </div>

  <!-- Audio & TTS Engine -->
  <script>
    class SoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      click() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }
      elim() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);
          gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.5);
        } catch(e) {}
      }
      gong() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(110, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(55, this.ctx.currentTime + 1.2);
          gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 1.2);
        } catch(e) {}
      }
    }
    const sfx = new SoundFX();
  </script>

  <!-- Game State & Controller -->
  <script>
    let G = {
      mode: 'murder_mystery', // 'murder_mystery' or 'mafia'
      imposterCountMode: 'auto',
      netMode: 'pass_phone',
      roomCode: '',
      isHost: true,
      myPlayerId: '',
      players: [],
      phase: 'mode_select',
      currentRevealIdx: 0,
      showCardModal: false,
      currentVoterIdx: 0,
      votes: {},
      discussionTimeLeft: 300,
      timerInterval: null,
      murdererTargetId: null,
      lastEliminatedPlayer: null,
      lastEliminatedForfeit: '',
      winner: null,
      currentPrompt: '',
      roundCount: 1
    };

    const betaSquadForfeits = [
      "Must wear a blindfold during the next entire discussion cycle!",
      "Must speak in a dramatic British accent for the rest of the game!",
      "Must sit facing the wall during the next interrogation round!",
      "Hand over your jacket / phone to the group until the game concludes!",
      "Must answer every question with a question for the next 2 rounds!",
      "Must do 20 push-ups right now in the center of the room!"
    ];

    const mafiaPrompts = [
      "Who was trying to dominate the conversation or defend someone too quickly?",
      "Which player's voting pattern or reaction during the last cycle felt out of character?",
      "If the person to your left turns out to be part of the mafia, would you be surprised?",
      "Who is sitting quietly without contributing much to the group deduction?",
      "Who do you trust the absolute least in this circle right now and why?"
    ];

    const murderMysteryPrompts = [
      "Who was acting overly quiet or evasive during the last few hours in the manor?",
      "Who do you suspect most of wandering the halls alone last night?",
      "If you had to inspect one person right now for hidden motives, who would it be?",
      "Who is trying too hard to direct suspicion away from themselves?",
      "Whose alibi or story about last night felt the most rehearsed or suspicious?"
    ];

    function getRandomPrompt() {
      const pool = G.mode === 'mafia' ? mafiaPrompts : murderMysteryPrompts;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getRandomForfeit() {
      return betaSquadForfeits[Math.floor(Math.random() * betaSquadForfeits.length)];
    }

    let peer = null;
    let peerConns = [];

    function initPeer(customId = null) {
      return new Promise((resolve) => {
        try {
          if (peer) { try { peer.destroy(); } catch(e) {} }
          peer = customId ? new Peer(customId, { host: '0.peerjs.com', port: 443, secure: true }) : new Peer({ host: '0.peerjs.com', port: 443, secure: true });
          let resolved = false;
          peer.on('open', (id) => { if (!resolved) { resolved = true; resolve(id); } });
          peer.on('connection', (conn) => {
            peerConns.push(conn);
            conn.on('data', (data) => handleIncomingData(data));
          });
          peer.on('error', () => { if (!resolved) { resolved = true; resolve(null); } });
          setTimeout(() => { if (!resolved) { resolved = true; resolve(peer?.id || null); } }, 2000);
        } catch(e) { resolve(null); }
      });
    }

    function broadcastState() {
      if (!G.isHost) return;
      peerConns.forEach(conn => {
        if (conn && conn.open) conn.send({ type: 'STATE_UPDATE', state: G });
      });
      renderState();
    }

    function handleIncomingData(data) {
      if (data.type === 'STATE_UPDATE') {
        G = data.state;
        renderState();
      } else if (data.type === 'JOIN_REQUEST' && G.isHost) {
        if (!G.players.find(p => p.id === data.player.id)) {
          G.players.push(data.player);
          broadcastState();
        }
      } else if (data.type === 'CAST_VOTE' && G.isHost) {
        G.votes[data.voterId] = data.targetId;
        broadcastState();
      }
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function assignRoles() {
      const total = G.players.length;
      let badCount = 1;
      if (G.imposterCountMode === 'auto') {
        if (total >= 8 && total <= 10) badCount = 2;
        else if (total > 10) badCount = 3;
      } else {
        badCount = Math.min(parseInt(G.imposterCountMode, 10), Math.floor(total / 2));
      }

      let roles = [];
      if (G.mode === 'mafia') {
        for (let i = 0; i < badCount; i++) roles.push('mafia');
        while (roles.length < total) roles.push('civilian');
      } else {
        for (let i = 0; i < badCount; i++) roles.push('murderer');
        while (roles.length < total) roles.push('manor_guest');
      }

      roles = shuffleArray(roles);
      G.players.forEach((p, idx) => {
        p.role = roles[idx];
        p.alive = true;
      });
      G.roundCount = 1;
    }

    function renderState() {
      const container = document.getElementById('screenContainer');
      const badge = document.getElementById('gameModeBadge');
      const title = document.getElementById('headerTitle');
      const sub = document.getElementById('headerSubtitle');

      if (G.mode === 'murder_mystery') {
        badge.textContent = 'MURDER MYSTERY EDITION';
        title.textContent = 'Manor Murder Mystery';
        sub.textContent = 'Find the murderer before you are eliminated in the dark!';
      } else {
        badge.textContent = 'BETA SQUAD MAFIA EDITION';
        title.textContent = 'Classic Mafia';
        sub.textContent = 'Multi-round debates, secret alliances, and elimination forfeits.';
      }

      switch (G.phase) {
        case 'mode_select':
          container.innerHTML = renderModeSelect();
          break;
        case 'lobby':
          container.innerHTML = renderLobby();
          break;
        case 'reveal':
          container.innerHTML = renderReveal();
          break;
        case 'discussion':
          container.innerHTML = renderDiscussion();
          break;
        case 'night_approaching':
          container.innerHTML = renderNightApproaching();
          break;
        case 'murderers_open_eyes':
          container.innerHTML = renderMurderersOpenEyes();
          break;
        case 'morning_break':
          container.innerHTML = renderMorningBreak();
          break;
        case 'vote_ballot':
          container.innerHTML = renderVoteBallot();
          break;
        case 'vote_results':
          container.innerHTML = renderVoteResults();
          break;
        case 'game_over':
          container.innerHTML = renderGameOver();
          break;
      }
    }

    function renderModeSelect() {
      const isMystery = G.mode === 'murder_mystery';
      const isPassPhone = G.netMode === 'pass_phone';

      return `
        <div class="flex flex-col items-center w-full space-y-4">
          <button onclick="selectGameMode('murder_mystery')" class="w-full text-left p-5 rounded-2xl card-interactive flex items-center justify-between group cursor-pointer">
            <div class="space-y-1 pr-4">
              <div class="flex items-center gap-2">
                <span class="text-xl">🏰</span>
                <h3 class="text-xl font-bold text-white group-hover:text-blue-400 transition-colors">Murder Mystery</h3>
              </div>
              <p class="text-xs text-slate-400 max-w-xs leading-relaxed">
                Roles: Murderer and Manor Guest. Features 3-min discussion, night kills, and ballot votes.
              </p>
            </div>
            <span class="px-4 py-1.5 ${isMystery ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-bold rounded-full shadow-md whitespace-nowrap">
              Mystery
            </span>
          </button>

          <button onclick="selectGameMode('mafia')" class="w-full text-left p-5 rounded-2xl card-interactive flex items-center justify-between group cursor-pointer">
            <div class="space-y-1 pr-4">
              <div class="flex items-center gap-2">
                <span class="text-xl">🕵️</span>
                <h3 class="text-xl font-bold text-white group-hover:text-blue-400 transition-colors">Classic Mafia</h3>
              </div>
              <p class="text-xs text-slate-400 max-w-xs leading-relaxed">
                Roles: Mafia and Civilian. Features continuous 5-minute discussion timers alternating with voting ballots.
              </p>
            </div>
            <span class="px-4 py-1.5 ${!isMystery ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-bold rounded-full shadow-md whitespace-nowrap">
              Classic
            </span>
          </button>

          <div class="flex items-center justify-between w-full px-2 pt-2 border-t border-slate-800/80 mt-2">
            <span class="text-xs text-slate-400 font-semibold">Networking Style:</span>
            <div class="flex gap-2">
              <button onclick="setNetMode('pass_phone')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${isPassPhone ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'} cursor-pointer">Pass-The-Phone</button>
              <button onclick="setNetMode('online')" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${!isPassPhone ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'} cursor-pointer">Online Party</button>
            </div>
          </div>
        </div>
      `;
    }

    function selectGameMode(mode) {
      sfx.click();
      G.mode = mode;
      G.discussionTimeLeft = mode === 'mafia' ? 300 : 180;
      G.phase = 'lobby';
      renderState();
    }

    function setNetMode(net) {
      sfx.click();
      G.netMode = net;
      renderState();
    }

    function renderLobby() {
      const settingsHTML = `
        <div class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Active Rulebook</span>
            <button onclick="G.mode = G.mode === 'mafia' ? 'murder_mystery' : 'mafia'; renderState();" class="px-3 py-1 bg-indigo-950 border border-indigo-500/40 text-indigo-300 text-xs font-bold rounded-full cursor-pointer">
              Switch to ${G.mode === 'mafia' ? 'Murder Mystery' : 'Classic Mafia'}
            </button>
          </div>
          <div>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">${G.mode === 'mafia' ? 'Mafia Count' : 'Murderer Count'}</span>
            <div class="grid grid-cols-4 gap-2">
              ${['auto', 1, 2, 3].map(c => `
                <button onclick="setImposterCount('${c}')" class="py-2 px-2 rounded-xl border font-bold text-xs transition-all ${String(G.imposterCountMode) === String(c) ? 'bg-blue-600 border-blue-400 text-white shadow-md' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'} cursor-pointer">
                  ${c === 'auto' ? 'Auto' : c}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      if (G.netMode === 'pass_phone') {
        return `
          <div class="flex flex-col items-center w-full space-y-4">
            ${settingsHTML}
            <div class="w-full space-y-2 text-left">
              <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block">Add Players (Min 3)</label>
              <div class="flex gap-2 w-full">
                <input type="text" id="playerNameInput" placeholder="Enter player name..." class="flex-1 bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
                <button onclick="addPassPlayer()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md cursor-pointer">Add</button>
              </div>
            </div>
            <div class="w-full bg-slate-950/40 border border-slate-800 rounded-2xl p-4 max-h-36 overflow-y-auto space-y-2">
              ${G.players.length === 0 ? `<div class="text-xs text-center text-slate-500 py-4">No players added yet. Add at least 3 players.</div>` : ''}
              ${G.players.map((p, i) => `
                <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2.5 text-sm">
                  <span class="font-semibold text-slate-200">${i+1}. ${p.name}</span>
                  <button onclick="removePlayer(${i})" class="text-red-400 hover:text-red-300 text-xs font-bold px-2 py-1 cursor-pointer">Remove</button>
                </div>
              `).join('')}
            </div>
            <div class="flex gap-3 w-full pt-2">
              <button onclick="G.phase='mode_select'; renderState();" class="w-1/3 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-sm transition-all cursor-pointer">Back</button>
              <button onclick="startGame()" ${G.players.length < 3 ? 'disabled class="w-2/3 py-3.5 bg-slate-800 text-slate-500 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="w-2/3 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm shadow-lg glow-blue transition-all cursor-pointer"'}>Start Game (${G.players.length})</button>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex flex-col items-center w-full space-y-4">
            ${settingsHTML}
            ${G.roomCode ? `
              <div class="bg-slate-950/80 border border-indigo-500/40 p-3.5 rounded-2xl text-center w-full">
                <span class="text-xs text-slate-400 uppercase tracking-widest block mb-0.5">Room Code</span>
                <span class="text-3xl font-extrabold text-indigo-400 tracking-widest">${G.roomCode}</span>
              </div>
            ` : `
              <div class="w-full space-y-3">
                <input type="text" id="handleInput" placeholder="Your Handle..." class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                <div class="grid grid-cols-2 gap-3">
                  <button onclick="createOnlineRoom()" class="py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm transition-all cursor-pointer">Create Room</button>
                  <button onclick="joinOnlineRoomPrompt()" class="py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-all cursor-pointer">Join Room</button>
                </div>
              </div>
            `}
            <div class="w-full bg-slate-950/40 border border-slate-800 rounded-2xl p-4 max-h-36 overflow-y-auto space-y-2">
              <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-2">Connected Players</span>
              ${G.players.map(p => `
                <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2 text-sm">
                  <span class="font-semibold text-slate-200">${p.name} ${p.id === G.myPlayerId ? '(You)' : ''}</span>
                  ${p.id === G.myPlayerId ? '<span class="text-xs bg-indigo-950 text-indigo-400 border border-indigo-800 px-2 py-0.5 rounded-full font-bold">HOST</span>' : ''}
                </div>
              `).join('')}
            </div>
            ${G.isHost && G.roomCode ? `
              <button onclick="startGame()" ${G.players.length < 3 ? 'disabled class="w-full py-3.5 bg-slate-800 text-slate-500 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm shadow-lg glow-blue transition-all cursor-pointer"'}>Start Multi-Device Game</button>
            ` : ''}
            <button onclick="G.phase='mode_select'; renderState();" class="text-xs text-slate-400 hover:text-white transition-colors pt-1 cursor-pointer">&larr; Back to Main Screen</button>
          </div>
        `;
      }
    }

    function addPassPlayer() {
      const input = document.getElementById('playerNameInput');
      if (!input || !input.value.trim()) return;
      sfx.click();
      G.players.push({
        id: 'p_' + Math.random().toString(36).substr(2, 9),
        name: input.value.trim(),
        role: '',
        alive: true
      });
      input.value = '';
      renderState();
    }

    function removePlayer(idx) {
      sfx.click();
      G.players.splice(idx, 1);
      renderState();
    }

    async function createOnlineRoom() {
      const handleInput = document.getElementById('handleInput');
      const name = handleInput && handleInput.value.trim() ? handleInput.value.trim() : 'Host Player';
      sfx.click();
      G.roomCode = generateCode();
      G.myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
      G.isHost = true;
      G.players = [{ id: G.myPlayerId, name: name, role: '', alive: true }];
      await initPeer('imposter_room_' + G.roomCode);
      renderState();
    }

    async function joinOnlineRoomPrompt() {
      const code = prompt("Enter 4-letter Room Code:");
      if (!code) return;
      const handleInput = document.getElementById('handleInput');
      const name = handleInput && handleInput.value.trim() ? handleInput.value.trim() : 'Player';
      sfx.click();
      G.roomCode = code.toUpperCase();
      G.myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
      G.isHost = false;
      await initPeer();
      const hostPeerId = 'imposter_room_' + G.roomCode;
      try {
        const conn = peer.connect(hostPeerId);
        conn.on('open', () => {
          conn.send({
            type: 'JOIN_REQUEST',
            player: { id: G.myPlayerId, name: name, role: '', alive: true }
          });
        });
        conn.on('data', (data) => handleIncomingData(data));
      } catch (err) {}
      renderState();
    }

    function setImposterCount(count) {
      sfx.click();
      G.imposterCountMode = count;
      if (G.netMode === 'online') broadcastState();
      else renderState();
    }

    function startGame() {
      if (G.players.length < 3) return;
      sfx.gong();
      assignRoles();
      G.currentRevealIdx = 0;
      G.showCardModal = false;
      G.phase = 'reveal';
      if (G.netMode === 'online') broadcastState();
      else renderState();
    }

    function renderReveal() {
      const p = G.players[G.currentRevealIdx];
      const isMafiaMode = G.mode === 'mafia';

      let roleTitle = '';
      let roleDesc = '';
      let isBad = false;

      if (isMafiaMode) {
        if (p.role === 'mafia') {
          roleTitle = 'MAFIA';
          roleDesc = 'Secretly eliminate players each night and deceive the group during debates!';
          isBad = true;
        } else {
          roleTitle = 'CIVILIAN';
          roleDesc = 'Identify suspicious patterns, defend yourself, and vote out the Mafia!';
        }
      } else {
        if (p.role === 'murderer') {
          roleTitle = 'MURDERER';
          roleDesc = 'Secretly choose victims each night and cover your tracks during manor investigations!';
          isBad = true;
        } else {
          roleTitle = 'MANOR GUEST';
          roleDesc = 'Examine clues, analyze alibis, and find out who committed the murder!';
        }
      }

      const partners = G.players
        .filter(x => x.id !== p.id && (x.role === 'mafia' || x.role === 'murderer'))
        .map(x => x.name);

      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div class="w-full bg-slate-950/60 border border-slate-800 rounded-3xl p-6 flex flex-col items-center">
            <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">PASS PHONE TO</span>
            <h2 class="text-3xl font-extrabold text-white mt-1">${p.name}</h2>
            <p class="text-xs text-slate-400 mt-2">Beta Squad Rule: Keep your secret card hidden!</p>
          </div>

          ${!G.showCardModal ? `
            <button onclick="G.showCardModal=true; sfx.click(); renderState();" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-extrabold text-base rounded-2xl shadow-xl hover:opacity-95 transition-all glow-blue cursor-pointer">
              VIEW SECRET ROLE CARD
            </button>
          ` : `
            <div class="w-full bg-slate-950/80 border ${isBad ? 'border-red-500/50' : 'border-emerald-500/50'} rounded-3xl p-6 flex flex-col items-center">
              <span class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">YOUR SECRET ROLE</span>
              <h3 class="text-3xl font-black ${isBad ? 'text-red-400' : 'text-emerald-400'} mb-2">${roleTitle}</h3>
              <p class="text-xs text-slate-300 max-w-xs mb-4 leading-relaxed">${roleDesc}</p>
              ${isBad && partners.length > 0 ? `
                <div class="w-full bg-slate-900/90 border border-red-900/40 rounded-xl p-3 mb-4">
                  <span class="text-xs text-red-400 font-bold block">PARTNERS IN CRIME:</span>
                  <span class="text-sm font-semibold text-white">${partners.join(', ')}</span>
                </div>
              ` : ''}
              <button onclick="nextReveal()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-all cursor-pointer">Hide Card & Pass Phone</button>
            </div>
          `}
        </div>
      `;
    }

    function nextReveal() {
      sfx.click();
      G.showCardModal = false;
      if (G.currentRevealIdx + 1 < G.players.length) {
        G.currentRevealIdx++;
        renderState();
      } else {
        startDiscussion();
      }
    }

    function startDiscussion() {
      G.phase = 'discussion';
      G.discussionTimeLeft = G.mode === 'mafia' ? 300 : 180;
      G.currentPrompt = getRandomPrompt();
      if (G.netMode === 'online') broadcastState();
      else renderState();
      startDiscussionTimer();
    }

    function startDiscussionTimer() {
      if (G.timerInterval) clearInterval(G.timerInterval);
      G.timerInterval = setInterval(() => {
        if (G.discussionTimeLeft > 0) {
          G.discussionTimeLeft--;
          renderTimerDisplay();
        } else {
          clearInterval(G.timerInterval);
          handleDiscussionEnd();
        }
      }, 1000);
    }

    function renderTimerDisplay() {
      const el = document.getElementById('timerMinutes');
      if (!el) return;
      const m = Math.floor(G.discussionTimeLeft / 60);
      const s = G.discussionTimeLeft % 60;
      el.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderDiscussion() {
      const m = Math.floor(G.discussionTimeLeft / 60);
      const s = G.discussionTimeLeft % 60;

      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div class="relative w-24 h-24 rounded-full bg-slate-950 border-2 border-indigo-500/50 flex flex-col items-center justify-center glow-indigo">
            <span id="timerMinutes" class="text-2xl font-black text-indigo-400 tracking-wider">${m}:${s < 10 ? '0' : ''}${s}</span>
          </div>
          <div>
            <div class="inline-block px-3 py-1 bg-indigo-950 border border-indigo-500/30 text-indigo-300 text-[10px] font-bold uppercase rounded-full mb-1">
              Round ${G.roundCount} • Debate & Accusations
            </div>
            <h2 class="text-2xl font-black text-white">${G.mode === 'mafia' ? '5-MINUTE DEBATE' : '3-MINUTE MANOR INVESTIGATION'}</h2>
          </div>
          <div class="w-full bg-indigo-950/40 border border-indigo-500/30 rounded-2xl p-4 text-left space-y-1">
            <div class="flex items-center justify-between">
              <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Beta Squad Interrogation Prompt</span>
              <button onclick="shufflePrompt()" class="text-[10px] text-indigo-300 hover:text-white underline font-semibold cursor-pointer">Shuffle Prompt</button>
            </div>
            <p id="interrogationPromptText" class="text-sm font-bold text-white">${G.currentPrompt}</p>
          </div>
          <div class="w-full bg-slate-950/40 border border-slate-800 rounded-2xl p-4 max-h-32 overflow-y-auto space-y-2">
            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">Living Players</span>
            <div class="grid grid-cols-2 gap-2">
              ${G.players.map(p => `
                <div class="flex items-center gap-2 p-2 rounded-xl ${p.alive ? 'bg-slate-900 border border-slate-800 text-slate-200' : 'bg-red-950/30 border border-red-900/40 text-red-500/60 line-through'} text-xs font-semibold">
                  <div class="w-2 h-2 rounded-full ${p.alive ? 'bg-emerald-400' : 'bg-red-500'}"></div>
                  <span>${p.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <button onclick="skipDiscussionTimer()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm rounded-xl transition-all shadow-lg glow-indigo cursor-pointer">
            PROCEED TO ${G.mode === 'mafia' ? 'VOTING' : 'NIGHT PHASE'} &rarr;
          </button>
        </div>
      `;
    }

    function shufflePrompt() {
      sfx.click();
      G.currentPrompt = getRandomPrompt();
      const el = document.getElementById('interrogationPromptText');
      if (el) el.textContent = G.currentPrompt;
      if (G.netMode === 'online') broadcastState();
    }

    function skipDiscussionTimer() {
      sfx.click();
      if (G.timerInterval) clearInterval(G.timerInterval);
      handleDiscussionEnd();
    }

    function handleDiscussionEnd() {
      if (G.mode === 'mafia') {
        goVoteBallot();
      } else {
        goToNightApproaching();
      }
    }

    function goToNightApproaching() {
      G.phase = 'night_approaching';
      if (G.netMode === 'online') broadcastState();
      else renderState();
      sfx.elim();
    }

    function renderNightApproaching() {
      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div class="w-20 h-20 rounded-full bg-slate-950 border-2 border-indigo-500/60 flex items-center justify-center text-indigo-400 shadow-xl">
            <span class="text-3xl">🌙</span>
          </div>
          <div>
            <h2 class="text-2xl font-black text-indigo-400">NIGHT PHASE — ROUND ${G.roundCount}</h2>
            <p class="text-xs text-slate-300 mt-1">Night is approaching. One manor guest will be eliminated. Guests, close your eyes!</p>
          </div>
          <button onclick="goToOpenEyes()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm rounded-xl shadow-lg glow-indigo transition-all cursor-pointer">
            Open Murderer's Eyes &rarr;
          </button>
        </div>
      `;
    }

    function goToOpenEyes() {
      sfx.click();
      G.phase = 'murderers_open_eyes';
      G.murdererTargetId = null;
      if (G.netMode === 'online') broadcastState();
      else renderState();
    }

    function renderMurderersOpenEyes() {
      const targets = G.players.filter(p => p.alive && p.role !== 'murderer');
      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div class="w-20 h-20 rounded-full bg-slate-950 border-2 border-red-500/60 flex items-center justify-center text-red-400 shadow-xl">
            <span class="text-3xl">🔪</span>
          </div>
          <div>
            <h2 class="text-2xl font-black text-red-400">MURDERER OPENS EYES</h2>
            <p class="text-xs text-slate-300 mt-1">Pass the phone privately to select who will be eliminated tonight.</p>
          </div>
          <div class="w-full space-y-2 max-h-48 overflow-y-auto">
            ${targets.map(p => `
              <button onclick="selectNightTarget('${p.id}')" class="w-full p-3.5 ${G.murdererTargetId === p.id ? 'bg-red-600 border-red-400 text-white' : 'bg-slate-900 hover:bg-slate-800 border-slate-700 text-slate-200'} border rounded-xl flex items-center justify-between font-bold text-sm transition-all cursor-pointer">
                <span>${p.name}</span>
                ${G.murdererTargetId === p.id ? '<span class="text-xs uppercase tracking-widest bg-black/40 px-2 py-0.5 rounded-full">Selected Victim</span>' : ''}
              </button>
            `).join('')}
          </div>
          <button onclick="concludeNightPhase()" ${!G.murdererTargetId ? 'disabled class="w-full py-3.5 bg-slate-800 text-slate-500 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-sm rounded-xl shadow-lg glow-blue transition-all cursor-pointer"'}>
            Confirm Night Elimination &rarr;
          </button>
        </div>
      `;
    }

    function selectNightTarget(id) {
      sfx.click();
      G.murdererTargetId = id;
      renderState();
    }

    function concludeNightPhase() {
      sfx.elim();
      if (G.murdererTargetId) {
        const victim = G.players.find(p => p.id === G.murdererTargetId);
        if (victim) {
          victim.alive = false;
          G.lastEliminatedPlayer = victim;
          G.lastEliminatedForfeit = getRandomForfeit();
        }
      }

      // Do NOT check win conditions before morning votes; proceed to morning break so players can discuss & vote!
      // Increment round count when moving to morning break
      G.roundCount++;

      G.phase = 'morning_break';
      if (G.netMode === 'online') broadcastState();
      else renderState();
    }

    function renderMorningBreak() {
      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div>
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-amber-950/70 border border-amber-500/30 rounded-full text-amber-300 text-xs font-bold tracking-widest uppercase mb-3 shadow-inner">
              SUNRISE BREAK • ROUND ${G.roundCount - 1}
            </div>
            <h2 class="text-3xl font-black text-amber-400">NIGHT CASUALTY REPORT</h2>
          </div>
          <div class="w-full bg-slate-950/60 border border-slate-800 p-5 rounded-2xl flex flex-col items-center space-y-3">
            <span class="text-xs text-slate-400 font-bold uppercase tracking-widest">ELIMINATED OVERNIGHT</span>
            ${G.lastEliminatedPlayer ? `
              <span class="text-xl font-black text-red-400">${G.lastEliminatedPlayer.name} was eliminated!</span>
              <div class="w-full bg-slate-900 border border-red-900/40 p-3 rounded-xl text-left">
                <span class="text-[10px] text-red-400 font-bold uppercase tracking-widest block mb-0.5">Beta Squad Game Forfeit:</span>
                <p class="text-xs font-semibold text-slate-200">${G.lastEliminatedForfeit}</p>
              </div>
            ` : `
              <span class="text-xl font-black text-slate-300">A peaceful night. No one was killed.</span>
            `}
          </div>
          <button onclick="goVoteBallot()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm rounded-xl transition-all shadow-lg glow-blue cursor-pointer">
            PROCEED TO GROUP VOTE &rarr;
          </button>
        </div>
      `;
    }

    function goVoteBallot() {
      if (checkWinConditions()) return;
      G.phase = 'vote_ballot';
      G.currentVoterIdx = 0;
      G.votes = {};
      if (G.netMode === 'online') broadcastState();
      else renderState();
      sfx.gong();
    }

    function renderVoteBallot() {
      const livingPlayers = G.players.filter(p => p.alive);
      const currentVoter = livingPlayers[G.currentVoterIdx];

      if (!currentVoter) {
        tallyVotesAndEliminate();
        return '';
      }

      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div>
            <div class="inline-block px-3.5 py-1 bg-indigo-950 border border-indigo-500/40 text-indigo-300 text-xs font-bold uppercase rounded-full mb-2">
              VOTING BALLOT (${G.currentVoterIdx + 1}/${livingPlayers.length})
            </div>
            <h2 class="text-2xl font-black text-white">${currentVoter.name}'S VOTE</h2>
            <p class="text-xs text-slate-400 mt-1">Cast your vote to eliminate a suspect from the group.</p>
          </div>
          <div class="w-full space-y-2 max-h-48 overflow-y-auto">
            ${livingPlayers.filter(p => p.id !== currentVoter.id).map(p => `
              <button onclick="castBallot('${currentVoter.id}', '${p.id}')" class="w-full p-3.5 bg-slate-900 hover:bg-slate-800 border border-slate-700/80 rounded-xl flex items-center justify-between font-bold text-sm text-slate-200 transition-all cursor-pointer">
                <span>${p.name}</span>
                <span class="text-xs text-blue-400">Vote &rarr;</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function castBallot(voterId, targetId) {
      sfx.click();
      G.votes[voterId] = targetId;
      const livingPlayers = G.players.filter(p => p.alive);
      if (G.currentVoterIdx + 1 < livingPlayers.length) {
        G.currentVoterIdx++;
        renderState();
      } else {
        tallyVotesAndEliminate();
      }
    }

    function tallyVotesAndEliminate() {
      const counts = {};
      Object.values(G.votes).forEach(tId => {
        counts[tId] = (counts[tId] || 0) + 1;
      });

      let maxVotes = 0;
      let eliminatedId = null;
      let isTie = false;

      Object.entries(counts).forEach(([tId, count]) => {
        if (count > maxVotes) {
          maxVotes = count;
          eliminatedId = tId;
          isTie = false;
        } else if (count === maxVotes) {
          isTie = true;
        }
      });

      if (!isTie && eliminatedId) {
        const p = G.players.find(x => x.id === eliminatedId);
        if (p) {
          p.alive = false;
          G.lastEliminatedPlayer = p;
          G.lastEliminatedForfeit = getRandomForfeit();
        }
      } else {
        G.lastEliminatedPlayer = null;
      }

      if (checkWinConditions()) return;

      G.phase = 'vote_results';
      if (G.netMode === 'online') broadcastState();
      else renderState();
    }

    function renderVoteResults() {
      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div>
            <h2 class="text-3xl font-black text-white">VOTING RESULTS</h2>
          </div>
          ${G.lastEliminatedPlayer ? `
            <div class="w-full bg-red-950/40 border border-red-800/60 p-5 rounded-2xl flex flex-col items-center space-y-3">
              <span class="text-xs text-red-400 font-bold uppercase tracking-widest">ELIMINATED BY GROUP VOTE</span>
              <span class="text-2xl font-black text-white">${G.lastEliminatedPlayer.name}</span>
              <span class="text-xs text-slate-300">True identity: <strong class="text-red-400 uppercase">${G.lastEliminatedPlayer.role.replace('_', ' ')}</strong></span>
              <div class="w-full bg-slate-900 border border-red-900/40 p-3 rounded-xl text-left mt-2">
                <span class="text-[10px] text-red-400 font-bold uppercase tracking-widest block mb-0.5">Beta Squad Game Forfeit:</span>
                <p class="text-xs font-semibold text-slate-200">${G.lastEliminatedForfeit}</p>
              </div>
            </div>
          ` : `
            <div class="w-full bg-slate-900/90 border border-slate-700/80 p-5 rounded-2xl">
              <span class="text-base font-bold text-amber-400">TIE VOTE!</span>
              <p class="text-xs text-slate-400 mt-1">No one was eliminated due to a tied vote.</p>
            </div>
          `}
          <button onclick="advanceRound()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm rounded-xl transition-all shadow-lg glow-blue cursor-pointer">
            START ROUND ${G.roundCount} ${G.mode === 'mafia' ? 'DEBATE' : 'INVESTIGATION'} &rarr;
          </button>
        </div>
      `;
    }

    function advanceRound() {
      sfx.click();
      if (G.mode === 'mafia') {
        G.roundCount++;
        startDiscussion();
      } else {
        goToNightApproaching();
      }
    }

    function checkWinConditions() {
      const badTeam = G.players.filter(p => p.alive && (p.role === 'mafia' || p.role === 'murderer'));
      const goodTeam = G.players.filter(p => p.alive && p.role !== 'mafia' && p.role !== 'murderer');

      if (G.players.length === 0) return false;

      if (badTeam.length === 0) {
        G.winner = G.mode === 'mafia' ? 'CIVILIANS' : 'MANOR GUESTS';
        G.phase = 'game_over';
        if (G.netMode === 'online') broadcastState();
        else renderState();
        return true;
      }
      if (badTeam.length >= goodTeam.length) {
        G.winner = G.mode === 'mafia' ? 'MAFIA' : 'MURDERER';
        G.phase = 'game_over';
        if (G.netMode === 'online') broadcastState();
        else renderState();
        return true;
      }
      return false;
    }

    function renderGameOver() {
      const isBadWin = G.winner === 'MAFIA' || G.winner === 'MURDERER';
      return `
        <div class="flex flex-col items-center text-center space-y-6 w-full">
          <div>
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block">GAME FINALE CONCLUDED</span>
            <h2 class="text-4xl font-black ${isBadWin ? 'text-red-400' : 'text-emerald-400'} mt-1">${G.winner} WIN!</h2>
          </div>
          <div class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl p-4 max-h-48 overflow-y-auto space-y-2">
            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-1">ALL PLAYER ROLES & FINAL STATUS</span>
            ${G.players.map(p => `
              <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2 text-xs font-semibold">
                <span class="text-white ${!p.alive ? 'line-through text-slate-500' : ''}">${p.name}</span>
                <span class="${p.role === 'mafia' || p.role === 'murderer' ? 'text-red-400' : 'text-emerald-400'} uppercase font-bold">${p.role.replace('_', ' ')}</span>
              </div>
            `).join('')}
          </div>
          <button onclick="G.phase='mode_select'; renderState();" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm rounded-xl shadow-lg glow-blue transition-all cursor-pointer">
            PLAY ANOTHER GAME &rarr;
          </button>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => { renderState(); });
    window.onload = function() { renderState(); };
  </script>
</body>
</html>
